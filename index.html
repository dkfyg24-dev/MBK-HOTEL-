<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBK HOTEL - Digital Menu</title>
    <style>
        :root {
            --primary: #d32f2f;
            --gold: #ffb300;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            --text-sub: #b0b0b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 30px;
        }

        header {
            background: linear-gradient(135deg, #111, #222);
            padding: 20px 15px;
            text-align: center;
            border-bottom: 3px solid var(--gold);
            position: relative;
        }

        header h1 {
            color: var(--gold);
            font-size: 2rem;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-sub);
            font-style: italic;
            font-size: 0.9rem;
            margin-top: 4px;
        }

        .admin-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--gold);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .category-nav {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            background: #1a1a1a;
            padding: 10px;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .cat-btn {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .cat-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            font-weight: bold;
        }

        .container {
            padding: 15px;
            max-width: 800px;
            margin: auto;
        }

        .category-title {
            color: var(--gold);
            margin: 20px 0 10px;
            font-size: 1.3rem;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #2a2a2a;
            position: relative;
        }

        .card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
        }

        .card-body {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .card-price {
            color: var(--gold);
            font-weight: bold;
            font-size: 1rem;
        }

        .out-of-stock {
            opacity: 0.5;
        }

        .badge-out {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--primary);
            color: white;
            padding: 2px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            font-weight: bold;
        }

        /* ADMIN MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: #222;
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--gold);
        }

        .modal h2 {
            color: var(--gold);
            margin-bottom: 15px;
        }

        .admin-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #333;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 6px;
            gap: 6px;
        }

        .admin-item input {
            background: #111;
            border: 1px solid #555;
            color: #fff;
            padding: 4px 6px;
            border-radius: 4px;
            width: 70px;
        }

        .admin-item input.name-input {
            width: 120px;
        }

        .close-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>MBK HOTEL</h1>
    <p>Good Food... Good Mood...</p>
    <button class="admin-btn" onclick="openAdmin()">Admin</button>
</header>

<div class="category-nav" id="categoryNav">
    <button class="cat-btn active" onclick="filterCat('all')">All</button>
    <button class="cat-btn" onclick="filterCat('Alfaham')">Alfaham</button>
    <button class="cat-btn" onclick="filterCat('Chicken Dishes')">Chicken</button>
    <button class="cat-btn" onclick="filterCat('Beef Special')">Beef</button>
    <button class="cat-btn" onclick="filterCat('Biryani Special')">Biryani</button>
    <button class="cat-btn" onclick="filterCat('Indian Bread')">Bread</button>
    <button class="cat-btn" onclick="filterCat('Vegetarian')">Veg</button>
</div>

<div class="container" id="menuContainer"></div>

<!-- Admin Modal -->
<div class="modal" id="adminModal">
    <div class="modal-content">
        <h2>Admin Dashboard</h2>
        <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 15px;">Item name, price change karein ya in-stock / out-of-stock manage karein.</p>
        <div id="adminItemsList"></div>
        <button class="close-btn" onclick="saveAndCloseAdmin()">Save & Close</button>
    </div>
</div>

<script>
const defaultMenu = [

    { id: 1, name: "ALFAHAM NORMAL", cat: "Alfaham", price: 120, img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=300", available: true },
    { id: 2, name: "ALFAHAM PERI PERI", cat: "Alfaham", price: 130, img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=300", available: true },
    { id: 3, name: "ALFAHAM PEPPER", cat: "Alfaham", price: 130, img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=300", available: true },
    { id: 4, name: "ALFAHAM HONEY", cat: "Alfaham", price: 140, img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=300", available: true },
    { id: 5, name: "ALFAHAM AFGHANI", cat: "Alfaham", price: 140, img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=300", available: true },
    { id: 6, name: "ALFAHAM KANDHARI", cat: "Alfaham", price: 140, img: "https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=300", available: true },
    
    // CHICKEN DISHES
    { id: 7, name: "CHICKEN 65", cat: "Chicken Dishes", price: 120, img: "https://images.unsplash.com/photo-1610057099443-fde8c4d50f91?w=300", available: true },
    { id: 8, name: "CHICKEN CHILLI", cat: "Chicken Dishes", price: 120, img: "https://images.unsplash.com/photo-1567620832903-9fc6debc209f?w=300", available: true },
    { id: 9, name: "CHICKEN MASALA", cat: "Chicken Dishes", price: 150, img: "https://images.unsplash.com/photo-1588166524941-3bf61a9c41db?w=300", available: true },
    { id: 10, name: "CHICKEN KONDATTAM", cat: "Chicken Dishes", price: 150, img: "https://images.unsplash.com/photo-1610057099443-fde8c4d50f91?w=300", available: true },
    { id: 11, name: "CHICKEN PEPPER", cat: "Chicken Dishes", price: 160, img: "https://images.unsplash.com/photo-1588166524941-3bf61a9c41db?w=300", available: true },
    { id: 12, name: "CHICKEN MANCHURIAN", cat: "Chicken Dishes", price: 160, img: "https://images.unsplash.com/photo-1567620832903-9fc6debc209f?w=300", available: true },
    { id: 13, name: "CHICKEN ROAST", cat: "Chicken Dishes", price: 160, img: "https://images.unsplash.com/photo-1588166524941-3bf61a9c41db?w=300", available: true },

    // BEEF SPECIAL
    { id: 14, name: "BEEF FRY", cat: "Beef Special", price: 120, img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=300", available: true },

    { id: 16, name: "BEEF MASALA", cat: "Beef Special", price: 160, img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=300", available: true },
    { id: 17, name: "BEEF PEPPER", cat: "Beef Special", price: 160, img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=300", available: true },
    { id: 18, name: "BEEF ROAST", cat: "Beef Special", price: 160, img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=300", available: true },

    { id: 20, name: "KUTTAN BIRYANI", cat: "Biryani Special", price: 130, img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=300", available: true },

    // INDIAN BREAD
    { id: 21, name: "CHAPPATHI", cat: "Indian Bread", price: 12, img: "https://images.unsplash.com/photo-1626074353765-517a681e40be?w=300", available: true },
    { id: 22, name: "PAROTTA", cat: "Indian Bread", price: 13, img: "https://images.unsplash.com/photo-1626074353765-517a681e40be?w=300", available: true },
    { id: 23, name: "NOOL POROTTA", cat: "Indian Bread", price: 20, img: "https://images.unsplash.com/photo-1626074353765-517a681e40be?w=300", available: true },
    { id: 24, name: "BUTTER NAAN", cat: "Indian Bread", price: 30, img: "https://images.unsplash.com/photo-1626074353765-517a681e40be?w=300", available: true },

    // VEGETARIAN
    { id: 25, name: "MIX VEGE MASALA", cat: "Vegetarian", price: 80, img: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=300", available: true },
    { id: 26, name: "GOPI MANJURI", cat: "Vegetarian", price: 120, img: "https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=300", available: true }
];

let menuData = JSON.parse(localStorage.getItem('mbk_menu')) || defaultMenu;
let currentCat = 'all';

function renderMenu() {
    const container = document.getElementById('menuContainer');
    container.innerHTML = '';

    const categories = currentCat === 'all' 
        ? [...new Set(menuData.map(item => item.cat))] 
        : [currentCat];

    categories.forEach(cat => {
        const catItems = menuData.filter(i => i.cat === cat);
        if (catItems.length === 0) return;

        const catTitle = document.createElement('h2');
        catTitle.className = 'category-title';
        catTitle.innerText = cat;
        container.appendChild(catTitle);

        const grid = document.createElement('div');
        grid.className = 'grid';

        catItems.forEach(item => {
            const card = document.createElement('div');
            card.className = `card ${!item.available ? 'out-of-stock' : ''}`;
            card.innerHTML = `
                ${!item.available ? '<span class="badge-out">Sold Out</span>' : ''}
                <img src="${item.img}" alt="${item.name}">
                <div class="card-body">
                    <div class="card-title">${item.name}</div>
                    <div class="card-price">₹${item.price}</div>
                </div>
            `;
            grid.appendChild(card);
        });

        container.appendChild(grid);
    });
}

function filterCat(cat) {
    currentCat = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderMenu();
}

function openAdmin() {
    const list = document.getElementById('adminItemsList');
    list.innerHTML = '';

    menuData.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'admin-item';
        row.innerHTML = `
            <input type="text" class="name-input" value="${item.name}" onchange="updateItem(${index}, 'name', this.value)">
            ₹<input type="number" value="${item.price}" onchange="updateItem(${index}, 'price', this.value)">
            <label style="font-size:0.75rem; color:#fff;">
                <input type="checkbox" ${item.available ? 'checked' : ''} onchange="updateItem(${index}, 'available', this.checked)"> In Stock
            </label>
        `;
        list.appendChild(row);
    });

    document.getElementById('adminModal').style.display = 'block';
}

function updateItem(index, field, value) {
    if (field === 'price') value = Number(value);
    menuData[index][field] = value;
}

function saveAndCloseAdmin() {
    localStorage.setItem('mbk_menu', JSON.stringify(menuData));
    document.getElementById('adminModal').style.display = 'none';
    renderMenu();
}

// Initial render
renderMenu();
</script>

</body>
</html>
