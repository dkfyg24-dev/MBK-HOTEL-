<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBK HOTEL - Luxury Menu</title>
    <style>
        :root {
            --gold: #e9b94d;
            --gold-glow: rgba(233, 185, 77, 0.4);
            --dark: #07080b;
            --card-bg: rgba(20, 22, 30, 0.75);
            --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--dark);
            color: var(--white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }
        
        /* Animated Floating Emojis Background */
        .emoji-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .emoji-item {
            position: absolute;
            font-size: 24px;
            opacity: 0.25;
            animation: floatUp 12s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.3; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .top-bar {
            background: rgba(10, 10, 14, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-sec { display: flex; flex-direction: column; }
        .logo { font-size: 20px; font-weight: bold; color: var(--gold); letter-spacing: 1px; }
        .sub-logo { font-size: 10px; color: #aaa; font-style: italic; }
        
        .nav-links { display: flex; gap: 10px; align-items: center; }
        .insta-btn, .admin-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
        }
        .admin-btn { background: var(--gold); color: #000; }

        /* Category Selector Bar */
        .category-nav {
            display: flex;
            gap: 8px;
            padding: 12px 15px;
            overflow-x: auto;
            background: rgba(15, 17, 23, 0.9);
            position: sticky;
            top: 58px;
            z-index: 90;
            border-bottom: 1px solid rgba(233,185,77,0.2);
        }
        .cat-tab {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(233,185,77,0.3);
            color: #ddd;
            padding: 8px 14px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }
        .cat-tab.active {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .container { max-width: 800px; margin: auto; padding: 15px; position: relative; z-index: 10; }
        .sec-header { color: var(--gold); margin: 20px 0 10px 0; font-size: 18px; border-left: 4px solid var(--gold); padding-left: 8px; }
        
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .item-card {
            background: var(--card-bg);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(233,185,77,0.2);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-name { font-size: 15px; font-weight: 600; }
        .item-price { color: var(--gold); font-size: 15px; font-weight: bold; margin-top: 3px; }
        .controls { display: flex; align-items: center; gap: 8px; }
        .action-btn { 
            background: var(--gold); 
            border: none; 
            padding: 6px 14px; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            color: #000;
        }
        .qty-btn { width: 30px; height: 30px; border-radius: 50%; font-size: 16px; border: 1px solid var(--gold); background: #000; color: var(--gold); cursor: pointer; }

        .cart-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(10, 10, 14, 0.95);
            border-top: 2px solid var(--gold);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 99;
        }
        
        .modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            display: none; justify-content: center; align-items: center;
            z-index: 1000; padding: 15px;
        }
        .modal-content {
            background: #14161f;
            border: 2px solid var(--gold);
            padding: 20px; border-radius: 12px;
            width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
        }
        input, select {
            width: 100%; padding: 10px; margin: 8px 0;
            background: #090a0e; border: 1px solid var(--gold);
            color: #fff; border-radius: 6px;
        }

        /* KOT Print Styling */
        @media print {
            body * { visibility: hidden; }
            #kot-print-area, #kot-print-area * { visibility: visible; }
            #kot-print-area { position: absolute; left: 0; top: 0; width: 100%; color: #000; background: #fff; padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Floating Background Emojis -->
    <div class="emoji-bg" id="emoji-container"></div>

    <div class="top-bar">
        <div class="logo-sec">
            <span class="logo">👑 MBK HOTEL</span>
            <span class="sub-logo">Good Food... Good Mood...</span>
        </div>
        <div class="nav-links">
            <a href="https://instagram.com" target="_blank" class="insta-btn">Insta</a>
            <button class="admin-btn" onclick="openAdminLogin()">Admin</button>
        </div>
    </div>

    <!-- Category Tabs -->
    <div class="category-nav" id="cat-tabs">
        <button class="cat-tab active" onclick="filterCategory('ALL')">ALL</button>
        <button class="cat-tab" onclick="filterCategory('ALFAHAM')">ALFAHAM</button>
        <button class="cat-tab" onclick="filterCategory('BEEF SPECIAL')">BEEF</button>
        <button class="cat-tab" onclick="filterCategory('CHICKEN DISHES')">CHICKEN</button>
        <button class="cat-tab" onclick="filterCategory('VEGETARIAN')">VEG</button>
        <button class="cat-tab" onclick="filterCategory('INDIAN BREAD')">BREAD</button>
        <button class="cat-tab" onclick="filterCategory('CHICKEN FRIED RICE')">FRIED RICE</button>
        <button class="cat-tab" onclick="filterCategory('BIRYANI SPECIAL')">BIRYANI</button>
    </div>

    <div class="container" id="menu-container"></div>

    <div style="height: 90px;"></div>

    <!-- Live Customer Cart Bar -->
    <div class="cart-bar">
        <div>
            <div>Cart Total: <span id="cart-count" style="color:var(--gold); font-weight:bold;">0</span> items</div>
            <div style="font-size:11px; color:#aaa;">Support: 8367873518</div>
        </div>
        <button class="action-btn" onclick="openCart()">View Cart</button>
    </div>

    <!-- Admin Modal -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <h3 style="color:var(--gold);">Admin Dashboard</h3>
            <div id="admin-login-sec">
                <input type="password" id="admin-pin" placeholder="Enter PIN (Default: 2222)">
                <button class="action-btn" onclick="verifyAdmin()">Login</button>
            </div>
            <div id="admin-panel-sec" style="display:none;">
                <h4>Live Orders & KOT</h4>
                <div id="live-orders-list"></div>
                <hr style="border-color:rgba(233,185,77,0.2); margin:15px 0;">
                <h4>Add New Menu Item</h4>
                <select id="new-category">
                    <option value="ALFAHAM">ALFAHAM</option>
                    <option value="BEEF SPECIAL">BEEF SPECIAL</option>
                    <option value="CHICKEN DISHES">CHICKEN DISHES</option>
                    <option value="VEGETARIAN">VEGETARIAN</option>
                    <option value="INDIAN BREAD">INDIAN BREAD</option>
                    <option value="CHICKEN FRIED RICE">CHICKEN FRIED RICE</option>
                    <option value="BIRYANI SPECIAL">BIRYANI SPECIAL</option>
                </select>
                <input type="text" id="new-name" placeholder="Item Name">
                <input type="number" id="new-price" placeholder="Price (₹)">
                <button class="action-btn" onclick="addNewItem()">Add Item</button>
                <br><br>
                <button style="background:red; color:#fff;" class="action-btn" onclick="closeAdmin()">Close Panel</button>
            </div>
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <h3 style="color:var(--gold);">Checkout Order</h3>
            <div id="cart-items-list" style="margin: 10px 0;"></div>
            <input type="text" id="cust-name" placeholder="Your Name">
            <input type="text" id="cust-phone" placeholder="Phone Number">
            <input type="text" id="cust-address" placeholder="Table No / Room / Address">
            <button class="action-btn" style="width:100%; margin-top:10px;" onclick="placeOrder()">Send Order via WhatsApp</button>
            <button class="action-btn" style="background:#555; color:#fff; width:100%; margin-top:8px;" onclick="closeCart()">Close</button>
        </div>
    </div>

    <!-- Hidden KOT Print Container -->
    <div id="kot-print-area"></div>

    <script>
        const adminWhatsApp = "918367873518";

        // Generate Flying Emojis
        const emojis = ['🍗', '🥩', '🍚', '🍞', '🍕', '🍔', '🥟', '🥗'];
        const emojiContainer = document.getElementById('emoji-container');
        for (let i = 0; i < 15; i++) {
            let el = document.createElement('div');
            el.className = 'emoji-item';
            el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.left = Math.random() * 100 + '%';
            el.style.animationDelay = Math.random() * 10 + 's';
            el.style.animationDuration = (8 + Math.random() * 8) + 's';
            emojiContainer.appendChild(el);
        }

        let defaultMenu = {
            "ALFAHAM": [
                {name: "ALFAHAM NORMAL", price: 120},
                {name: "ALFAHAM PERI PERI", price: 130},
                {name: "ALFAHAM PEPPER", price: 130},
                {name: "ALFAHAM HONEY", price: 140},
                {name: "ALFAHAM AFGHANI", price: 140},
                {name: "ALFAHAM KANDHARI", price: 140},
                {name: "NORMAL ALFAHAM MANDHI (Q)", price: 160},
                {name: "PERI PERI ALFAHAM MANDHI (Q)", price: 170},
                {name: "PEPPER ALFAHAM MANDHI (Q)", price: 170},
                {name: "AFGHANI ALFAHAM MANDHI (Q)", price: 200},
                {name: "HONEY ALFAHAM MANDHI (Q)", price: 180}
            ],
            "BEEF SPECIAL": [
                {name: "BEEF FRY", price: 120},
                {name: "BEEF CHILLI", price: 130},
                {name: "BEEF MASALA", price: 160},
                {name: "BEEF PEPPER", price: 160},
                {name: "BEEF ROAST", price: 160},
                {name: "BEEF KONDATTAM", price: 170},
                {name: "BEEF CHILLI GRAVY", price: 170},
                {name: "BEEF MANJURI", price: 170}
            ],
            "CHICKEN DISHES": [
                {name: "CHICKEN 65", price: 120},
                {name: "CHICKEN CHILLI", price: 120},
                {name: "CHICKEN MASALA", price: 150},
                {name: "CHICKEN KONDATTAM", price: 150},
                {name: "CHICKEN PEPPER", price: 160},
                {name: "CHICKEN MANCHURIAN", price: 160},
                {name: "CHICKEN GARLIC", price: 160},
                {name: "CHICKEN GINGER", price: 160},
                {name: "CHICKEN ROAST", price: 160},
                {name: "CHICKEN CHUKKA", price: 160},
                {name: "CHICKEN KADAI", price: 170},
                {name: "CHICKEN KRUMA", price: 170},
                {name: "CHICKEN BUTTER", price: 170},
                {name: "CHICKEN TIGER", price: 170},
                {name: "CHICKEN DRAGON", price: 190}
            ],
            "VEGETARIAN": [
                {name: "MIX VEGE MASALA", price: 80},
                {name: "GREEN PEES KURUMA", price: 80},
                {name: "MIX VEGE KURUMA", price: 100},
                {name: "MIX VEGE KADAI", price: 120},
                {name: "GOPI MANJURI", price: 120},
                {name: "GOPI CHILLI", price: 120}
            ],
            "INDIAN BREAD": [
                {name: "CHAPPATHI", price: 12},
                {name: "PAROTTA", price: 13},
                {name: "NOOL POROTTA", price: 20},
                {name: "ATTA POROTTA", price: 20},
                {name: "TANDOORI ROTI", price: 20},
                {name: "BUTTER ROTI", price: 25},
                {name: "PLAIN NAAN", price: 20},
                {name: "BUTTER NAAN", price: 30}
            ],
            "CHICKEN FRIED RICE": [
                {name: "VEG. FRIED RICE", price: 120},
                {name: "EGG FRIED RICE", price: 130},
                {name: "CHICKEN FRIED RICE", price: 140},
                {name: "SCHEZWAN FRIED RICE", price: 160},
                {name: "MIXED FRIED RICE", price: 170}
            ],
            "BIRYANI SPECIAL": [
                {name: "CHICKEN BIRYANI", price: 120},
                {name: "KUTTAN BIRYANI", price: 130}
            ]
        };

        let menuData = JSON.parse(localStorage.getItem('mbk_menu')) || defaultMenu;
        let cart = {};
        let orders = JSON.parse(localStorage.getItem('mbk_orders')) || [];
        let currentFilter = 'ALL';

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMenu();
        }

        function renderMenu() {
            let container = document.getElementById('menu-container');
            container.innerHTML = '';

            for (let category in menuData) {
                if (currentFilter !== 'ALL' && currentFilter !== category) continue;

                let html = `<div class="sec-header">${category}</div><div class="menu-grid">`;
                menuData[category].forEach((item) => {
                    let qty = cart[item.name]?.qty || 0;
                    html += `
                        <div class="item-card">
                            <div>
                                <div class="item-name">${item.name}</div>
                                <div class="item-price">₹${item.price}</div>
                            </div>
                            <div class="controls">
                                ${qty === 0 ? 
                                    `<button class="action-btn" onclick="addToCart('${item.name}', ${item.price})">Add</button>` :
                                    `<button class="qty-btn" onclick="changeQty('${item.name}', -1)">-</button>
                                     <span style="font-weight:bold;">${qty}</span>
                                     <button class="qty-btn" onclick="changeQty('${item.name}', 1)">+</button>`
                                }
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
                container.innerHTML += html;
            }
            let totalCount = Object.values(cart).reduce((sum, i) => sum + i.qty, 0);
            document.getElementById('cart-count').innerText = totalCount;
        }

        function addToCart(name, price) {
            cart[name] = {price: price, qty: 1};
            renderMenu();
        }

        function changeQty(name, change) {
            cart[name].qty += change;
            if (cart[name].qty <= 0) delete cart[name];
            renderMenu();
        }

        function openCart() {
            let list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            let total = 0;
            for (let name in cart) {
                let itemTotal = cart[name].price * cart[name].qty;
                total += itemTotal;
                list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:4px 0;"><span>${name} (x${cart[name].qty})</span><span>₹${itemTotal}</span></div>`;
            }
            list.innerHTML += `<hr style="margin:8px 0; border-color:rgba(233,185,77,0.3);"><div style="display:flex; justify-content:space-between; font-weight:bold; color:var(--gold);"><span>Total Amount</span><span>₹${total}</span></div>`;
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

        function placeOrder() {
            let name = document.getElementById('cust-name').value;
            let phone = document.getElementById('cust-phone').value;
            let address = document.getElementById('cust-address').value;
            if(!name || !phone) { alert('Please enter name and phone number!'); return; }

            let orderItemsStr = '';
            let grandTotal = 0;
            for(let k in cart) {
                let sub = cart[k].price * cart[k].qty;
                grandTotal += sub;
                orderItemsStr += `• ${k} x ${cart[k].qty} = ₹${sub}\n`;
            }

            let order = {
                id: Date.now(),
                name: name,
                phone: phone,
                address: address,
                items: {...cart},
                total: grandTotal,
                status: 'Pending'
            };

            orders.unshift(order);
            localStorage.setItem('mbk_orders', JSON.stringify(orders));

            // Format WhatsApp Message
            let msg = `*NEW ORDER - MBK HOTEL*\n` +
                      `------------------\n` +
                      `*Customer:* ${name}\n` +
                      `*Phone:* ${phone}\n` +
                      `*Address/Table:* ${address}\n\n` +
                      `*Items Ordered:*\n${orderItemsStr}\n` +
                      `*Grand Total:* ₹${grandTotal}\n` +
                      `------------------`;

            let waUrl = `https://wa.me/${adminWhatsApp}?text=${encodeURIComponent(msg)}`;
            window.open(waUrl, '_blank');

            alert('Order submitted! WhatsApp opened to confirm.');
            cart = {};
            closeCart();
            renderMenu();
        }

        function openAdminLogin() { document.getElementById('admin-modal').style.display = 'flex'; }
        function closeAdmin() { 
            document.getElementById('admin-modal').style.display = 'none'; 
            document.getElementById('admin-login-sec').style.display = 'block';
            document.getElementById('admin-panel-sec').style.display = 'none';
        }

        function verifyAdmin() {
            let pin = docum
